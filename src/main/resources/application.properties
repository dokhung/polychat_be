spring.application.name=polychat_be
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

logging.level.root=WARN
spring.main.banner-mode=off
logging.level.com.example.polychat_be.PolychatBeApplication=WARN
logging.level.com.example.polychat_be.StartupLogger=INFO
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:polychat}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:polychat}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:polychat}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:polychat-local-dev-secret-change-this-to-a-long-random-value}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
