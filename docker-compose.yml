services:
  postgres:
    image: postgres:16-alpine
    container_name: polychat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polychat
      POSTGRES_USER: polychat
      POSTGRES_PASSWORD: polychat
    ports:
      - "5432:5432"
    volumes:
      - polychat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polychat -d polychat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polychat_postgres_data:
